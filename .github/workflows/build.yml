name: Build ZK AI IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZK AI
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -o ZK_AI_Native_v0.1.0_SOURCE_AND_BUILD.zip -d project

      - name: Fix AppState initialization
        run: |
          set -e
          sed -i '' 's/let installID: String/var installID: String = ""/' project/ZKAINative/AppState.swift
          sed -i '' 's/let launchCount: Int/var launchCount: Int = 0/' project/ZKAINative/AppState.swift

          echo "Checking AppState fix:"
          grep "installID" project/ZKAINative/AppState.swift
          grep "launchCount" project/ZKAINative/AppState.swift

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: project
        run: |
          xcodegen generate

      - name: Build iPhone app
        working-directory: project
        run: |
          set -e
          xcodebuild \
            -project ZKAINative.xcodeproj \
            -scheme ZKAINative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify app was built
        working-directory: project
        run: |
          set -e
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/ZK AI.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ZK AI.app was not found."
            exit 1
          fi

          echo "ZK AI.app built successfully."

      - name: Make IPA
        working-directory: project
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/ZK AI.app" \
            Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            ZK-AI-Native-v0.1.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZK-AI-Native-v0.1.0-IPA
          path: project/ZK-AI-Native-v0.1.0.ipa
          if-no-files-found: error
